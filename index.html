<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SignalR Hub Client</title>
  <!-- <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.7/dist/browser/signalr.min.js"></script> -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/10.0.11/signalr.js" integrity="sha512-Z7gHR36L05e+ZqrQusA3zkuT3fVZCtz6huyhnTE7FWXUEnVOaSDISCI2EzRn3S0ah/LXnXfhUoHNMDoYfVHj2A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      color: #202a32;
      background: #f2f5f3;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #f2f5f3 0%, #e8f0ec 55%, #f5f3ed 100%);
    }

    main {
      width: min(760px, calc(100% - 32px));
      margin: 48px auto;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid #cdd8d2;
      padding-bottom: 20px;
    }

    h1 { margin: 0; font-size: 24px; font-weight: 650; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #58665f;
      font-size: 14px;
    }

    .status::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #929d97;
      content: "";
    }

    .status[data-state="connected"] { color: #236b4b; }
    .status[data-state="connected"]::before { background: #238653; }
    .status[data-state="connecting"], .status[data-state="reconnecting"] { color: #8a641f; }
    .status[data-state="connecting"]::before, .status[data-state="reconnecting"]::before { background: #d49a2a; }

    form { display: grid; gap: 16px; padding: 24px 0; }

    label { display: grid; gap: 7px; color: #53615a; font-size: 13px; font-weight: 600; }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #c5d0ca;
      border-radius: 5px;
      padding: 9px 11px;
      background: #fff;
      color: #202a32;
      font: inherit;
      font-size: 14px;
    }

    input:focus { outline: 2px solid #32845d; outline-offset: 1px; }

    .actions { display: flex; gap: 8px; }

    button {
      min-height: 40px;
      border: 1px solid #176b47;
      border-radius: 5px;
      padding: 8px 15px;
      background: #176b47;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary { border-color: #bdc9c2; background: transparent; color: #35443c; }
    button:disabled { cursor: default; opacity: .5; }

    h2 { margin: 8px 0 10px; font-size: 15px; font-weight: 650; }

    #events {
      min-height: 190px;
      max-height: 48vh;
      overflow: auto;
      margin: 0;
      border-top: 1px solid #cdd8d2;
      padding: 12px 0;
      color: #35443c;
      font: 13px/1.55 Consolas, "Courier New", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 520px) {
      main { margin: 28px auto; }
      header { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>SignalR Hub Client</h1>
      <div id="status" class="status" data-state="disconnected" role="status">Disconnected</div>
    </header>

    <form id="connection-form">
      <label>
        Negotiate endpoint
        <input id="endpoint" type="url" value="http://localhost:7071/api" required>
      </label>
      <label>
        Hub event to listen for
        <input id="event-name" type="text" value="message" required>
      </label>
      <div class="actions">
        <button id="connect" type="submit">Connect</button>
        <button id="disconnect" class="secondary" type="button" disabled>Disconnect</button>
      </div>
    </form>

    <section aria-labelledby="events-heading">
      <h2 id="events-heading">Connection and event log</h2>
      <pre id="events" aria-live="polite"></pre>
    </section>
  </main>

  <script>
    const form = document.querySelector("#connection-form");
    const endpointInput = document.querySelector("#endpoint");
    const eventInput = document.querySelector("#event-name");
    const status = document.querySelector("#status");
    const connectButton = document.querySelector("#connect");
    const disconnectButton = document.querySelector("#disconnect");
    const events = document.querySelector("#events");
    let connection;

    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      events.textContent += `[${timestamp}] ${message}\n`;
      events.scrollTop = events.scrollHeight;
    }

    function setStatus(value) {
      status.dataset.state = value.toLowerCase();
      status.textContent = value;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (connection) return;

      connectButton.disabled = true;
      setStatus("Connecting");
      log(`Attempting to connect to ${endpointInput.value}`);

      try {
        const eventName = eventInput.value.trim();
        const nextConnection = new signalR.HubConnectionBuilder()
          .withUrl(endpointInput.value)
          .withAutomaticReconnect()
          .build();

        nextConnection.on(eventName, (payload) => {
          log(`${eventName}: ${JSON.stringify(payload)}`);
        });
        nextConnection.onreconnecting((error) => {
          setStatus("Reconnecting");
          log(`Connection lost; reconnecting${error ? `: ${error.message}` : ""}`);
        });
        nextConnection.onreconnected((connectionId) => {
          setStatus("Connected");
          log(`Reconnected${connectionId ? ` (connection ${connectionId})` : ""}`);
        });
        nextConnection.onclose((error) => {
          connection = undefined;
          connectButton.disabled = false;
          disconnectButton.disabled = true;
          setStatus("Disconnected");
          log(`Connection closed${error ? `: ${error.message}` : ""}`);
        });

        await nextConnection.start();
        connection = nextConnection;
        disconnectButton.disabled = false;
        setStatus("Connected");
        log(`Connected; listening for "${eventName}" events.`);
      } catch (error) {
        connection = undefined;
        connectButton.disabled = false;
        setStatus("Disconnected");
        log(`Error: ${error.message}`);
      }
    });

    disconnectButton.addEventListener("click", async () => {
      if (!connection) return;
      disconnectButton.disabled = true;
      await connection.stop();
    });
  </script>
</body>
</html>
